<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1 · What we found — Millennium Mutual</title><link rel="stylesheet" href="/shared.css"></head>
<body><div class="wrap" id="app"><div class="card">Reading the data…</div></div>
<script src="/shared.js"></script><script src="/simple.js"></script><script src="/story.js"></script><script src="/common.js"></script>
<script>
function render(state){
  const stories=STORY(state), m=state.signals.meta, dq=state.signals.signals.find(s=>s.issue==='data-quality')?.evidence||{};
  const app=document.getElementById('app');
  app.innerHTML=PG.hero('What is going on at Millennium Mutual?',`We read ${m.policies.toLocaleString()} policies and ${m.claimsUnique} claims. Here are the ${stories.length} things that matter, in plain words. Press <b>📊</b> under any sentence to see the data behind it, or <b>📰</b> to read the articles.`)
  +PG.steps(state)
  +`<div class="cards2">${stories.map(s=>`<article class="story" id="${s.id}"><div class="top"><span class="ic">${s.icon}</span><span class="sev ${s.severity.split(' ')[0]}">${s.severity.toUpperCase()}</span></div><h2>${S.esc(s.headline)}</h2><p class="sub">${S.esc(s.sub)}</p><div class="mini">${S.chart(s.charts[0],{compact:true})}</div>${PG.btns(s.id,s)}<div><a href="/research.html#${s.id}">Why is this happening? →</a></div></article>`).join('')}</div>`
  +`<details class="more card" style="margin-top:18px"><summary>More patterns the machine found (${state.signals.signals.length} in total) — press 📊 on any line</summary>${state.signals.signals.map(sg=>`<div class="rowsig"><span class="t">${S.esc(sg.headline)}</span><span class="tag">${S.esc((sg.lensName||'').replace(/ \(.*\)/,''))}</span><button class="pbtn" data-act="sig" data-id="${sg.id}">📊</button></div>`).join('')}</details>`
  +`<p class="note" style="margin-top:14px">First we cleaned the data: ${dq.premiumAsText||0} prices stored as text, ${(dq.policyDatesDMY||0)+(dq.claimDatesDMY||0)} dates in another format, ${dq.duplicatesRemoved||0} duplicate claims. Earned premium assumes 12-month policies. Every number is from policies.csv and claims.csv.</p>`;
  PG.wire(app,stories,state);
}
MM.boot('signals',render);
</script></body></html>
