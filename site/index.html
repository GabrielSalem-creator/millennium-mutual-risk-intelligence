<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1 · What we found — Millennium Mutual</title><link rel="stylesheet" href="/shared.css">
<style>
.wrap{max-width:980px}.h{margin:34px 0 4px;font-size:clamp(24px,3vw,34px);letter-spacing:-.02em}.sub0{color:var(--mute);margin:0 0 16px}
.sig{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:18px 20px;margin:12px 0;border-radius:16px;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--panel)}
.sig .no{font:800 22px ui-monospace,Menlo,monospace;color:var(--c)}.sig h3{margin:0 0 4px;font-size:clamp(17px,1.9vw,21px);line-height:1.25}.sig p{margin:0;color:var(--mute);font-size:15px}
.sig .big{text-align:right;min-width:130px}.sig .big b{display:block;font-size:clamp(26px,3vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--c)}.sig .big span{font-size:12px;color:var(--mute)}
.sig .btns{grid-column:2/4;margin-top:2px}
@media(max-width:700px){.sig{grid-template-columns:34px 1fr}.sig .big{grid-column:2;text-align:left}.sig .btns{grid-column:1/3}}
.win{border:1px solid var(--accent);border-radius:20px;padding:24px;background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 90%,transparent),color-mix(in srgb,var(--accent) 10%,var(--panel)))}
.win .hero{font-size:clamp(30px,4.6vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 8px}.win .hero em{font-style:normal;color:var(--bad)}.win .hero i{font-style:normal;color:var(--good)}
.sc3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}@media(max-width:800px){.sc3{grid-template-columns:1fr}}
.sc{border-radius:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--line)}.sc.best{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}.sc small{color:var(--mute);display:block;min-height:40px;font-size:13px}.sc b{font-size:34px;letter-spacing:-.03em;font-weight:800}.sc .p{color:var(--mute);font-size:13.5px}
.path{margin:16px 0;padding:14px 16px;border-radius:14px;background:var(--goodbg);border:1px solid var(--good)}.path ol{margin:6px 0 0 20px;padding:0}.path li{margin:6px 0;font-size:16px}
table.t td,table.t th{padding:9px 8px;font-size:15px}.up{color:var(--bad);font-weight:700}.dn{color:var(--good);font-weight:700}
.sl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0}@media(max-width:700px){.sl{grid-template-columns:1fr}}.sl label{font-size:12.5px;color:var(--mute);display:block}.sl input{width:100%;accent-color:var(--accent)}
.foot a{margin-right:16px}
</style></head>
<body><div class="wrap" id="app"><div class="card">Reading the data…</div></div>
<script src="/shared.js"></script><script src="/simple.js"></script><script src="/story.js"></script><script src="/common.js"></script>
<script>
const COL={Urgent:'#ff7a6e',Important:'#f0b958','Good news':'#4cd6a0',Watch:'#8b82ff'};
let PR=null;
function bigStat(id,state,CH){const pt=(c,si,x)=>CH[c]?.series?.[si]?.points?.find(p=>p.x===x)?.y,e=state.signals.signals.find(s=>s.detector==='early-claim + threshold-structuring')?.evidence||{},wp=CH['wait-renewal']?.series?.[0]?.points||[],w=wp[wp.length-1]?.y;
  return ({b07:[`${e.theftClaims||60} vs ${Math.round(e.expectedTheft||3)}`,'theft claims vs normal'],mtl:[((pt('city-water',0,'Montréal')||0)/(pt('city-water',0,'Toronto')||1)).toFixed(1)+'×','Montréal vs Toronto'],home:[Math.round((pt('home-vs-auto',0,'Home')||0)*100)+'¢ vs '+Math.round((pt('home-vs-auto',0,'Auto')||0)*100)+'¢','paid per $1: Home vs Auto'],wait:['30 vs 13','days to close: big vs small'],leave:[Math.round((w||0)*100)+'%','leave after a 30+ day claim'],brokers:['1 of 10','brokers is the problem'],big:['1 in 10','claims = 32% of the money'],bundle:['−23%','fewer claims with both lines']})[id]||['',''];}
const $=n=>'$'+Math.round(n).toLocaleString('en-CA'), P=x=>(x>=0?'+':'−')+Math.round(Math.abs(x)*100)+'%';
function calc(pr,e,l,m){
  const M=pr.montrealHome,prem=M.premiumPerYear,w=M.waterCostPerYear,o=M.otherCostPerYear,pf=M.waterFreqOtherCities/M.waterFreqMontreal,need=(c,mg)=>c*(1+l)/(1-e-mg),mk=prem*(1+M.marketParityStep);
  const aBE=(1-e)*mk/(1+l),aTG=(1-e-m)*mk/(1+l);
  return {prem,today:need(w+o,0),peer:need(o+w*pf,0),mk,cutBE:Math.max(0,1-(aBE-o)/w),cutTG:Math.max(0,1-(aTG-o)/w),crNow:(w+o)*(1+l)/prem+e,crMk:(w+o)*(1+l)/mk+e,crNoWater:o*(1+l)/prem+e,wshare:w/(w+o)};
}
function priceSection(state){
  const pr=state.decisions.pricing,A=pr.assumptions,e=+document.getElementById('se')?.value/100||A.expense,l=+document.getElementById('sl')?.value/100||A.laeOfLosses,m=+document.getElementById('sm')?.value/100||A.targetMargin,c=calc(pr,e,l,m);
  const rows=pr.rows.filter(r=>r.product==='Home').map(r=>{const be=r.city==='Montréal'?c.today:r.costPerYear*(1+l)/(1-e),tg=r.costPerYear*(1+l)/(1-e-m),inc=be/r.premiumPerYear-1;return {...r,be,inc,incT:tg/r.premiumPerYear-1}});
  const bands=pr.bands.map(r=>{const be=r.costPerYear*(1+l)/(1-e);return {...r,be,inc:be/r.premiumPerYear-1}});
  const autoOK=pr.rows.filter(r=>r.product==='Auto').map(r=>({...r,inc:r.costPerYear*(1+l)/(1-e)/r.premiumPerYear-1}));
  return `<div class="win"><div style="color:var(--mute);font-size:13px;letter-spacing:.1em;font-weight:700">MONTRÉAL HOME · WHAT IT TAKES TO MAKE MONEY</div>
  <div class="hero">Price alone: <em>${P(c.today/c.prem-1)}</em>.<br>Price + fewer water claims: <i>${P(c.mk/c.prem-1)}</i>.</div>
  <p style="margin:0;color:var(--mute);max-width:70ch">We charge <b style="color:var(--ink)">${$(c.prem)}</b> a year. Water alone makes up <b style="color:var(--ink)">${Math.round(c.wshare*100)}%</b> of what Montréal homes cost us. Without water the same policy would be profitable (combined ratio ${c.crNoWater.toFixed(2)}).</p>
  <div class="sc3"><div class="sc"><small>1 · Price alone, water claims unchanged</small><b>${$(c.today)}</b><div class="p">${P(c.today/c.prem-1)} · not realistic, customers leave first</div></div>
  <div class="sc"><small>2 · Price alone, if water claims fell to our other cities’ level</small><b>${$(c.peer)}</b><div class="p">${P(c.peer/c.prem-1)} · needs the water problem fixed first</div></div>
  <div class="sc best"><small>3 · Market-level price AND fewer water claims</small><b>${$(c.mk)}</b><div class="p">${P(c.mk/c.prem-1)} price + ${Math.round(c.cutBE*100)}% fewer water claims = break-even</div></div></div>
  <div class="path"><b>The path to profit</b><ol><li><b>Raise Montréal Home to ${$(c.mk)}</b> (${P(c.mk/c.prem-1)}). That is where the market already is. Combined ratio goes from ${c.crNow.toFixed(2)} to ${c.crMk.toFixed(2)}.</li><li><b>Cut water claims by ${Math.round(c.cutBE*100)}%</b> (backwater valves, leak shut-offs, spring inspections, stricter new business) to break even. <b>${Math.round(c.cutTG*100)}%</b> reaches a ${Math.round(m*100)}% profit margin.</li><li>Until then, pause new Montréal Home sales through brokers.</li></ol></div>
  <div class="btns"><button class="pbtn" id="pdata">📊 See the data</button><button class="pbtn" id="part">📰 See the articles</button></div></div>
  <h3 style="margin:26px 0 6px">Home insurance: price now vs price needed to break even</h3>
  <table class="t"><tr><th>City</th><th>We charge</th><th>Claims + handling cost</th><th>Needed to break even</th><th>Change</th></tr>${rows.sort((a,b)=>b.inc-a.inc).map(r=>`<tr><td>${r.city}</td><td>${$(r.premiumPerYear)}</td><td>${$(r.costPerYear*(1+l))}</td><td>${$(r.be)}</td><td class="${r.inc>0.005?'up':'dn'}">${P(r.inc)}</td></tr>`).join('')}</table>
  <h3 style="margin:22px 0 6px">Montréal Home by risk band</h3>
  <table class="t"><tr><th>Band</th><th>We charge</th><th>Needed to break even</th><th>Change</th></tr>${bands.map(r=>`<tr><td>${r.band}</td><td>${$(r.premiumPerYear)}</td><td>${$(r.be)}</td><td class="up">${P(r.inc)}</td></tr>`).join('')}</table>
  <p class="note">Auto has room to spare: it could come down in ${autoOK.filter(r=>r.inc<-0.05).length} of 5 cities. Costs are what the data shows for the last two years and exclude broker B07.</p>
  <div class="sl"><div><label>Expense load: <b>${Math.round(e*100)}%</b></label><input id="se" type="range" min="15" max="45" value="${Math.round(e*100)}"></div><div><label>Claims handling (% of claims): <b>${Math.round(l*100)}%</b></label><input id="sl" type="range" min="0" max="20" value="${Math.round(l*100)}"></div><div><label>Profit margin wanted: <b>${Math.round(m*100)}%</b></label><input id="sm" type="range" min="0" max="15" value="${Math.round(m*100)}"></div></div>
  <p class="note">${S.esc(A.note)} Move the sliders to test other assumptions; every number above updates.</p>`;
}
function render(state){
  const stories=STORY(state),m=state.signals.meta,CH=state.signals.charts||{},app=document.getElementById('app');
  app.innerHTML=`<div class="hero"><div style="font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--accent)">MILLENNIUM MUTUAL</div><h1 style="font-size:clamp(34px,5vw,60px);letter-spacing:-.035em;line-height:1.02;margin:10px 0">What the data says.</h1><p style="max-width:56ch">${m.policies.toLocaleString()} policies and ${m.claimsUnique} claims, checked from every angle. These are the ${stories.length} things that matter. Press 📊 to see the data behind any line.</p></div>
  <h2 class="h">The signals</h2><p class="sub0">Each one checked against articles and statistics.</p>
  ${stories.map((s,i)=>{const [v,l]=bigStat(s.id,state,CH),c=COL[s.severity]||COL[s.severity.split(' ')[0]]||'#8b82ff';return `<article class="sig" id="${s.id}" style="--c:${c}"><div class="no">${i+1}</div><div><h3>${S.esc(s.headline)}</h3><p>${S.esc(s.sub)}</p></div><div class="big"><b>${S.esc(v)}</b><span>${S.esc(l)}</span></div><div class="btns"><button class="pbtn" data-act="data" data-id="${s.id}">📊 See the data</button><button class="pbtn" data-act="art" data-id="${s.id}">📰 Articles (${s.articles.length})</button><button class="pbtn chat" data-chat-story="${s.id}" data-chat-title="${S.esc(s.headline)}">💬 Ask the AI</button><a href="/research.html#${s.id}" style="align-self:center;font-size:13.5px">why →</a></div></article>`}).join('')}
  <h2 class="h">How much to raise the price to win</h2><p class="sub0">Precise numbers for Montréal and the rest of Home insurance.</p><div id="price">${priceSection(state)}</div>
  <p class="foot note" style="margin-top:30px"><a href="/research.html">② Why it happens</a><a href="/decisions.html">③ What to do</a><a href="/how.html">How the machine works</a><a href="/platform.html" target="_blank">Price one customer ↗</a></p>`;
  PG.wire(app,stories,state);
  const wirePrice=()=>{const box=document.getElementById('price');box.querySelectorAll('input[type=range]').forEach(i=>i.oninput=()=>{const keep=i.id;box.innerHTML=priceSection(state);wirePrice();document.getElementById(keep).focus()});
    const hs=stories.find(x=>x.id==='home'),ms=stories.find(x=>x.id==='mtl'),pr=state.decisions.pricing,c=calc(pr,+document.getElementById('se').value/100,+document.getElementById('sl').value/100,+document.getElementById('sm').value/100),e=+document.getElementById('se').value/100,l=+document.getElementById('sl').value/100;
    document.getElementById('pdata').onclick=()=>{const homeRows=pr.rows.filter(r=>r.product==='Home');S.openProof({title:'Montréal Home: the price maths',tab:'data',articles:[...ms.articles,...hs.articles],charts:[
      {id:'pm1',title:'Home: what we charge vs what we need, per year',type:'groupbars',unit:'$ per policy-year',series:[{name:'we charge today',points:homeRows.map(r=>({x:r.city,y:r.premiumPerYear}))},{name:'needed to break even',points:homeRows.map(r=>({x:r.city,y:Math.round(r.costPerYear*(1+l)/(1-e))}))}],plain:'Montréal, Toronto and Ottawa are charged less than their claims cost; Calgary is about right; Québec City has room.',how:'Premium = average earned premium per policy-year. Needed = (claims cost × (1 + handling)) ÷ (1 − expenses). Broker B07 excluded.',source:'policies.csv + claims.csv'},
      {id:'pm2',title:'Montréal Home: where the money goes, per policy per year',type:'bars',unit:'$ per policy-year',series:[{name:'$',points:[{x:'We charge',y:Math.round(c.prem)},{x:'Water claims',y:Math.round(pr.montrealHome.waterCostPerYear)},{x:'Other claims',y:Math.round(pr.montrealHome.otherCostPerYear)},{x:'Needed to break even',y:Math.round(c.today)}]}],plain:'Water claims alone cost more than the whole premium.',how:'Estimated claim cost per policy-year, split into Water Damage and everything else, Montréal Home policies.',source:'claims.csv joined to policies.csv'}]})};
    document.getElementById('part').onclick=()=>S.openProof({title:'Why Montréal Home is under-priced: articles',tab:'art',charts:[],articles:[...ms.articles,...hs.articles]});};
  wirePrice();
}
MM.boot('signals',render);
</script></body></html>
