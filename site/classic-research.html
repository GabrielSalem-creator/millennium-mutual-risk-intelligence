<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research — Millennium Mutual</title>
<link rel="stylesheet" href="/shared.css">
<style>
.wrap{font-size:16.5px}
.wrap h2{font-size:24px;margin-top:30px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:10px 0}
@media(max-width:1100px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.step .n{display:inline-block;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:28px;font-weight:700;margin-bottom:4px}
.step h3{font-size:17px}.step p{margin:2px 0 8px;color:var(--mute);font-size:14.5px}
.step .got{border-top:1px dashed var(--line);padding-top:8px;font-size:14.5px}.step .got b{color:var(--good)}
.rbtn{font-size:16px;padding:11px 18px}
.bal{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2);margin:6px 0}
.bal i{display:block;height:100%}.bal .s{background:var(--good)}.bal .c{background:var(--bad)}.bal .x{background:var(--mute)}
.issue{margin:18px 0;scroll-margin-top:110px}
.issue>summary,.issue .hd{list-style:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin-top:8px}
.ev{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:12px;padding:12px 14px;font-size:15px}
.ev.supports{border-left-color:var(--good)}.ev.challenges{border-left-color:var(--bad)}
.ev h4{margin:0 0 4px;font-size:16px;line-height:1.3}
.ev .stat{display:inline-block;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:3px 9px;margin:4px 0;font-size:14px}.ev .stat b{color:var(--accent)}
.ev p{margin:6px 0}.ev .lbl{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.ev .snip{font-style:italic;color:var(--mute)}
.qs{font-size:14px;color:var(--mute);margin:4px 0}.qs li{margin:2px 0}
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
#log{max-height:340px;overflow:auto;font:12.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:10px 12px;margin:0}
.nav2{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.sum li{margin:6px 0}
</style></head>
<body><div class="wrap" id="app"><h1>② Research</h1><p class="lede">Loading…</p></div>
<script src="/shared.js"></script><script src="/classic-research.js"></script></body></html>
